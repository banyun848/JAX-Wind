[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxwind"
version = "0.0.0"
description = "Functional JAX large-eddy simulation solver"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
tools = ["h5py>=3.10"]
# The finite-volume solver's GPU pressure solve. The package lives in the
# external/jax-amg submodule; install it with 'pip install -e external/jax-amg'
# for a checkout, and note that it needs AmgX and a CUDA-enabled jaxlib.
amg = ["jaxamg>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["jaxwind.windfarm.reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Keep the default suite deliberately small and architectural. Detailed
# backend, scaling, visualization, and publication-reproduction tests
# remain available with: pytest -o 'python_files=test_*.py'
python_files = [
    "test_poisson.py",
    "test_operators.py",
    "test_low_mach.py",
    "test_cryogenic.py",
    "test_surface.py",
    "test_turbine.py",
    "test_hitsz.py",
]

[tool.ruff]
line-length = 88
extend-exclude = ["src/jaxwind/windfarm/reference/openfast"]
