schema_version = 1
formulation = "boussinesq"

[case]
name = "hitsz_r9_fv_warmup_clustered_256x128x64_l12"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_loglaw_clustered_64.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[mesh]
cells = [256, 128, 64]
lengths_m = [12.0, 6.0, 3.6]

# Separable analytical coordinates: uniform horizontal cells and one-sided
# tanh clustering at the ground.  focus_m is expressed in physical metres.

[mesh.mapping]
types = ["uniform", "uniform", "tanh"]
focus_m = [6.0, 3.0, 0.0]
strength = [0.0, 0.0, 1.5]

[time]
# This is the adaptive warmup ceiling.  The fixed precursor/main cadence is
# configured separately below.
dt_seconds = 0.02
steps = 45000


cfl = 1.0
chunk_steps = 50

[numerics]
dtype = "float32"

# The workflow uses FFT for both periodic stages and overrides this with GMG
# for the enforced-inflow main stage.
pressure_backend = "fft"
gmg_tolerance = 1.0e-5
gmg_presweeps = 4
gmg_postsweeps = 4
gmg_anisotropy_aware = false
time_integration = "fast-rk3"
turbulent_prandtl = 0.4
spectrum_diagnostic = "none"

[output]
directory = "outputs/hitsz_r9_fv_warmup_clustered_256x128x64_l12"

[diagnostics]
sample_start_step = 36000
sample_every_steps = 180
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]

[physics.flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[physics.scalar]
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[physics.turbine]
model = "hitsz-r9-ad-bem"
x_m = 3.0
y_m = 3.0
hub_height_m = 0.876
rotor_speed_rpm = 480.0
blade_pitch_degrees = 0.0
smoothing_width_m = 0.09375
smearing_azimuthal_elements = 64
body_smoothing_width_m = 0.1875
nacelle_drag_coefficient = 1.0
tower_drag_coefficient = 1.0

[workflow]
# 900 s warmup, followed by matched 90 s precursor and main windows.
warmup_steps = 45000
precursor_steps = 36000
main_steps = 36000
record_plane = 10
precursor_dt_seconds = 0.0025
precursor_frame_count = 100
main_dt_seconds = 0.0025
main_frame_count = 100
chunk_steps = 50
output_directory = "outputs/hitsz_r9_fv_warmup_clustered_256x128x64_l12"
main_pressure_force = false
evolve_scalar = false
