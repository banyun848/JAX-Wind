[case]
name = "hitsz_r9_fv_uniform_1024x256x128_l24_warmup_plus10s"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_profile.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[domain]
cells = [1024, 256, 128]
lengths_m = [24.0, 6.0, 3.6]


[flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[scalar]
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[time]
dt_seconds = 0.02
steps = 45000


[numerics]
dtype = "float32"

[diagnostics]
sample_start_step = 36000
sample_every_steps = 180
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]


[finite_volume]
pressure_backend = "fft"
gmg_tolerance = 1.0e-5
gmg_presweeps = 4
gmg_postsweeps = 4
gmg_anisotropy_aware = false
time_integration = "fast-rk3"
cfl_ceiling = 1.0
turbulent_prandtl = 0.4
chunk_steps = 50
spectrum_diagnostic = "none"
output_directory = "outputs/hitsz_r9_fv_uniform_1024x256x128_l24_warmup_plus10s"

[finite_volume_workflow]
# Continue the projected t=900 s coarse warmup for 10 additional seconds.
warmup_steps = 500
precursor_steps = 1
main_steps = 1
record_plane = 20
chunk_steps = 10
output_directory = "outputs/hitsz_r9_fv_uniform_1024x256x128_l24_warmup_plus10s"
warmup_restart_checkpoint = "outputs/hitsz_r9_fv_uniform_1024x256x128_l24_warmup_plus10s/prolonged_warmup_initial.npz"
main_pressure_force = false
evolve_scalar = false
