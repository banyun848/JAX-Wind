[case]
name = "hitsz_r9_ln2_cooled_far_wake_256x64x128"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_profile.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[domain]
cells = [256, 64, 128]
lengths_m = [24.0, 6.0, 3.6]


[flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[scalar]
reference_value = 0.0
surface_flux = 0.0
# For T' = T - 300 K, b_z = g T' / T_ref. A cold anomaly is downward.
buoyancy_acceleration_per_unit = 0.0327

[time]
dt_seconds = 0.02
steps = 45000


[numerics]
dtype = "float32"

[diagnostics]
sample_start_step = 36000
sample_every_steps = 180
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]


[finite_volume]
pressure_backend = "fft"
time_integration = "fast-rk3"
cfl_ceiling = 1.0
turbulent_prandtl = 0.4
scalar_advection_scheme = "upwind"
chunk_steps = 100
spectrum_diagnostic = "none"
output_directory = "outputs/hitsz_ln2_far_wake/cooled_buoyant_upwind"

[finite_volume_workflow]
warmup_steps = 45000
precursor_steps = 8000
main_steps = 8000
record_plane = 10
precursor_dt_seconds = 0.01125
main_dt_seconds = 0.01125
main_substeps_per_inflow = 2
main_frame_count = 100
chunk_steps = 100
input_directory = "outputs/hitsz_r9_fv_workflow_256x64x128"
output_directory = "outputs/hitsz_ln2_far_wake/cooled_buoyant_upwind"
main_pressure_force = false
evolve_scalar = true

[finite_volume_turbine]
model = "hitsz-r9-ad-bem"
x_m = 12.0
y_m = 3.0
hub_height_m = 0.876
rotor_speed_rpm = 480.0
blade_pitch_degrees = 0.0
smoothing_width_m = 0.09375
smearing_azimuthal_elements = 64
body_smoothing_width_m = 0.1875
nacelle_drag_coefficient = 1.0
tower_drag_coefficient = 1.0

[finite_volume_cooling]
# The integral is calibrated from mass and enthalpy, not nozzle geometry:
# Q = eta*m_dot*[(1-x_exit)*L_v + cp_N2*(T_ambient-T_injection)]
#   = 4842.57 W for eta=1.
mass_flow_rate_kg_s = 0.0125
exit_vapor_quality = 0.217596
injection_temperature_k = 77.34
ambient_temperature_k = 300.0
liquid_latent_heat_j_kg = 199180.0
nitrogen_heat_capacity_j_kg_k = 1040.0
air_density_kg_m3 = 1.225
air_heat_capacity_j_kg_k = 1005.0
thermal_coupling_efficiency = 1.0
streamwise_offset_m = 0.30
standard_deviation_m = [0.30, 0.30, 0.12]
ramp_time_s = 1.0
