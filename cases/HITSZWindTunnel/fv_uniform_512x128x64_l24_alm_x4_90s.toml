[case]
name = "hitsz_r9_fv_uniform_512x128x64_l24_alm_x4_90s"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_loglaw_uniform_64.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[domain]
cells = [512, 128, 64]
lengths_m = [24.0, 6.0, 3.6]


[flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[scalar]
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[time]
dt_seconds = 0.02
steps = 45000


[numerics]
dtype = "float32"

[diagnostics]
sample_start_step = 36000
sample_every_steps = 180
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]


[finite_volume]
pressure_backend = "fft"
gmg_tolerance = 1.0e-5
gmg_presweeps = 4
gmg_postsweeps = 4
gmg_anisotropy_aware = false
time_integration = "fast-rk3"
cfl_ceiling = 1.0
turbulent_prandtl = 0.4
chunk_steps = 50
spectrum_diagnostic = "none"
output_directory = "outputs/hitsz_r9_fv_uniform_512x128x64_l24_alm_x4_90s"

[finite_volume_workflow]
# Reuse the completed 90 s precursor for a separate 90 s ALM main run.
warmup_steps = 45000
precursor_steps = 36000
main_steps = 36000
record_plane = 10
precursor_dt_seconds = 0.0025
precursor_frame_count = 100
main_dt_seconds = 0.0025
main_frame_count = 100
chunk_steps = 50
output_directory = "outputs/hitsz_r9_fv_uniform_512x128x64_l24_alm_x4_90s"
input_directory = "outputs/hitsz_r9_fv_uniform_512x128x64_l24"
main_pressure_force = false
evolve_scalar = false

[finite_volume_turbine]
model = "hitsz-r9-alm"
x_m = 4.0
y_m = 3.0
hub_height_m = 0.876
rotor_speed_rpm = 480.0
blade_pitch_degrees = 0.0
# Scalar fallback; ALM uses the per-element factor below.
smoothing_width_m = 0.09375
smoothing_width_chord_factor = 0.5
initial_azimuth_degrees = 0.0
body_smoothing_width_m = 0.1875
nacelle_drag_coefficient = 1.0
tower_drag_coefficient = 1.0
