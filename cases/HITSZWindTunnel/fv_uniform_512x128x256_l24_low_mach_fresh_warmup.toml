[case]
name = "hitsz_r9_fv_uniform_512x128x256_l24_low_mach_fresh_warmup"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_loglaw_uniform_256.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[domain]
cells = [512, 128, 256]
lengths_m = [24.0, 6.0, 3.6]

[scales]
length_m = 3.6
velocity_m_s = 1.0
scalar = 1.0

[flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[scalar]
quantity = "potential_temperature"
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[time]
dt_seconds = 0.005
steps = 180000

[sgs]
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
update_interval_steps = 4
timescale_coefficient = 1.5
momentum_initial_coefficient = 0.03
momentum_minimum_coefficient = 1.0e-6
momentum_maximum_coefficient = 0.81
scalar_initial_coefficient = 0.03
scalar_minimum_coefficient = 0.0
scalar_maximum_coefficient = 1.0
stratification_beta = 30.0
stratification_power = 2.0

[numerics]
dtype = "float32"
pressure_method = "transpose"
thomas_chunk = 1
cfl_warning = 0.75
cfl_abort = 1.05
trajectory_cfl_abort = 1.2

[diagnostics]
sample_start_step = 144000
sample_every_steps = 720
log_every_steps = 720
checkpoint_every_steps = 18000
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]

[output]
directory = "outputs/hitsz_low_mach_fresh_warmup/fv_512x128x256_900s"

[finite_volume]
pressure_backend = "fft"
gmg_tolerance = 1.0e-5
gmg_presweeps = 4
gmg_postsweeps = 4
gmg_anisotropy_aware = false
time_integration = "fast-rk3"
cfl_ceiling = 1.0
momentum_closure = "amd"
turbulent_prandtl = 0.4
chunk_steps = 600
spectrum_diagnostic = "none"
output_directory = "outputs/hitsz_low_mach_fresh_warmup/fv_512x128x256_900s"

[finite_volume_workflow]
# Grid and physics contract for a fresh 900 s low-Mach warmup.
warmup_steps = 180000
precursor_steps = 36000
main_steps = 36000
record_plane = 10
precursor_dt_seconds = 0.0025
precursor_frame_count = 100
main_dt_seconds = 0.0025
main_frame_count = 100
chunk_steps = 600
output_directory = "outputs/hitsz_low_mach_fresh_warmup/fv_512x128x256_900s"
main_pressure_force = false
evolve_scalar = false
